name: iOS simulator

on:
  push:
    branches: [claude/zero-waste-meal-planner-egqcie]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: 2.0.0
      # No Sentry auth token in CI: the Sentry Xcode build phase would otherwise fail the build.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      APP_NAME: Demidemi
      BUNDLE_ID: app.demidemi.ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npx expo prebuild --platform ios --clean --no-install

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - run: pod install || (sleep 30 && pod install)
        working-directory: ios

      - name: Build Release simulator app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json -project "${WORKSPACE%.xcworkspace}.xcodeproj" \
            | node -e 'console.log(JSON.parse(require("fs").readFileSync(0)).project.schemes[0])')
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          mkdir -p build
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build/xcodebuild.log 2>&1 \
            || { grep -E 'error:' build/xcodebuild.log | head -50; tail -40 build/xcodebuild.log; exit 1; }
          tail -3 build/xcodebuild.log
          APP_PATH=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0)).devices;
            const ios=Object.keys(d).filter(r=>r.includes("iOS")).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
            const all=ios.flatMap(r=>d[r].map(x=>({...x,r})));
            const pick=all.filter(x=>x.name==="iPhone 17 Pro").pop()||all.filter(x=>x.name.startsWith("iPhone")).pop();
            console.error("Simulator:",pick.name,pick.r);console.log(pick.udid)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p build/screens build/logs

      - name: Launch smoke test
        run: |
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl io booted recordVideo --codec=h264 build/run.mp4 &
          echo "VIDEO_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          PID=$(xcrun simctl launch booted "$BUNDLE_ID" | awk '{print $NF}')
          sleep 15
          xcrun simctl io booted screenshot build/screens/launch-15s.png
          xcrun simctl spawn booted log show --last 5m --style compact \
            --predicate "process == \"$APP_NAME\"" > build/logs/app.log || true
          if grep -E 'RCTFatal|Unhandled JS Exception|RedBox|Terminating app due to' build/logs/app.log; then
            echo "::error::JS fatal error / crash marker found in app log"; exit 1
          fi
          if ! ps -p "$PID" > /dev/null; then
            echo "::error::App is not running 15 s after launch"; exit 1
          fi

      - name: Prepare simulator for Maestro
        run: |
          for key in KeyboardAutocorrection KeyboardPrediction KeyboardAutocapitalization KeyboardCheckSpelling KeyboardSmartPunctuation; do
            xcrun simctl spawn "$UDID" defaults write com.apple.Preferences "$key" -bool false
          done
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          # The photo picker cannot be targeted by file name: fill the library so any cell near the middle is the recipe screenshot.
          mkdir -p "$RUNNER_TEMP/media"
          for i in $(seq -w 1 24); do cp e2e/assets/recipe-screenshot.png "$RUNNER_TEMP/media/recipe-screenshot-$i.png"; done
          xcrun simctl addmedia "$UDID" "$RUNNER_TEMP"/media/*.png

      - name: Maestro flows
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          shasum -a 256 "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/maestro/bin:$PATH"
          set +e
          mkdir -p build/maestro build/screens/launch
          mv build/screens/launch-15s.png build/screens/launch/ 2>/dev/null || true
          run_flow() {
            local name=$1 out="$GITHUB_WORKSPACE/build/screens/$1"
            # Maestro 2 writes screenshots and recordings into ./screenshots but only creates it on takeScreenshot.
            mkdir -p "$out/screenshots"
            ( cd "$out" && maestro --device "$UDID" test "$GITHUB_WORKSPACE/e2e/maestro/$name.yaml" \
                --format junit --output "$GITHUB_WORKSPACE/build/maestro/$name.xml" --test-output-dir "$out" )
            local status=$?
            find "$out/screenshots" -type f \( -name '*.png' -o -name '*.mp4' \) -exec mv -n {} "$out/" \;
            return $status
          }
          run_flow smoke; SMOKE=$?
          FAILED=""
          for flow in jess marcus nadia theo; do
            run_flow "$flow" || { FAILED="$FAILED $flow"; echo "::warning::Maestro persona flow failed: $flow"; }
          done
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<testsuites>'
            for f in build/maestro/*.xml; do
              sed -e '/<?xml/d' -e 's#</\{0,1\}testsuites[^>]*>##g' "$f"
            done
            echo '</testsuites>'
          } > build/maestro.xml
          {
            echo "### Maestro"
            echo "- smoke: $([ "$SMOKE" = 0 ] && echo passed || echo FAILED)"
            for flow in jess marcus nadia theo; do
              case " $FAILED " in *" $flow "*) echo "- $flow: FAILED (see build/screens/$flow)";; *) echo "- $flow: passed";; esac
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$SMOKE"

      - name: App Store screenshots (6.9-inch)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          export PATH="$RUNNER_TEMP/maestro/bin:$PATH"
          MAX=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0)).devices;
            const all=Object.keys(d).filter(r=>r.includes("iOS")).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).flatMap(r=>d[r]);
            const pick=all.filter(x=>x.name==="iPhone 17 Pro Max").pop()||all.filter(x=>x.name.endsWith("Pro Max")).pop();
            console.error("Store simulator:",pick.name);console.log(pick.udid)')
          xcrun simctl boot "$MAX"
          xcrun simctl bootstatus "$MAX" -b
          xcrun simctl install "$MAX" "$APP_PATH"
          xcrun simctl status_bar "$MAX" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          shoot() {
            local out="$GITHUB_WORKSPACE/build/store/$1"; shift
            mkdir -p "$out/screenshots"
            ( cd "$out" && maestro --device "$MAX" test "$@" "$GITHUB_WORKSPACE/e2e/maestro/store.yaml" --test-output-dir "$out" )
            find "$out/screenshots" -name '*.png' -exec mv -n {} "$out/" \;
          }
          shoot en-US
          shoot fr-FR -e APP_LANG=fr -e APP_LOCALE=fr_FR -e TAB_WEEK=Semaine -e TAB_RECIPES=Recettes -e TAB_LIST=Courses
          sips -g pixelWidth -g pixelHeight build/store/*/*.png

      - name: Stop video and collect crash logs
        if: always()
        run: |
          [ -n "$VIDEO_PID" ] && kill -INT "$VIDEO_PID" && sleep 3 || true
          cp ~/Library/Logs/DiagnosticReports/${APP_NAME}* build/logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/screens
            build/store
            build/logs
            build/run.mp4
            build/maestro.xml
            build/xcodebuild.log
